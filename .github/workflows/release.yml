name: Release Second Brain

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  release:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'windows-latest'
            args: ''
          - platform: 'macos-latest'
            args: '--target aarch64-apple-darwin'

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: 'npm'

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin' || '' }}

      - name: Install dependencies
        run: npm ci || npm install

      - name: Ensure resource directories and placeholders
        shell: bash
        run: |
          mkdir -p src-tauri/resources/llama src-tauri/resources/sd src-tauri/resources/onnxruntime src-tauri/resources/laya
          touch src-tauri/resources/llama/placeholder.txt
          touch src-tauri/resources/sd/placeholder.txt
          touch src-tauri/resources/onnxruntime/placeholder.txt
          touch src-tauri/resources/laya/placeholder.txt

      - name: Setup NSIS and Cache (Windows)
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        run: |
          $dir = "$env:LOCALAPPDATA\tauri\NSIS"
          New-Item -ItemType Directory -Force -Path $dir | Out-Null
          $dest = "$dir\nsis-3.11.zip"
          Write-Host "Pre-downloading verified NSIS 3.11 from SourceForge to bypass GitHub CDN 504..."
          curl.exe -fL --retry 5 --retry-delay 3 -o $dest "https://downloads.sourceforge.net/project/nsis/NSIS%203/3.11/nsis-3.11.zip"
          if (Test-Path $dest) {
            Write-Host "NSIS 3.11 pre-cached successfully ($((Get-Item $dest).Length) bytes)"
          }
          choco install nsis -y
          $nsisPath = "C:\Program Files (x86)\NSIS"
          if (Test-Path $nsisPath) {
            echo $nsisPath | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
            & "$nsisPath\makensis.exe" /VERSION
          }

      - name: Build Tauri Desktop Application (.exe / .dmg / .app)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'Second Brain ${{ github.ref_name }}'
          releaseBody: |
            ## Second Brain ${{ github.ref_name }}
            
            ### Included Release Assets:
            - **Windows**: `Second Brain_*_x64-setup.exe` (NSIS Installer) & `.msi`
            - **macOS**: `Second Brain_*_aarch64.dmg` (Disk Image) & `.app`
            
            ### Highlights:
            - **Infinite Canvas & Mochi Co-Pilot**: Interactive 24-mascot companion studio with lively 8-way eye tracking.
            - **Local-First AI Engine**: Offline image diffusion, local GGUF text generation, and dynamic chat canvas.
            - **Bento Studio Preferences**: Creator profile rank, clean mascot badges, and balanced configuration tabs.
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}

