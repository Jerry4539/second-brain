name: Release Second Brain

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  release:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'windows-latest'
            args: ''
          - platform: 'macos-latest'
            args: '--target aarch64-apple-darwin'

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: 'npm'

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin' || '' }}

      - name: Install dependencies
        run: npm ci || npm install

      - name: Ensure resource directories and placeholders
        shell: bash
        run: |
          mkdir -p src-tauri/resources/llama src-tauri/resources/sd src-tauri/resources/onnxruntime src-tauri/resources/laya
          touch src-tauri/resources/llama/placeholder.txt
          touch src-tauri/resources/sd/placeholder.txt
          touch src-tauri/resources/onnxruntime/placeholder.txt
          touch src-tauri/resources/laya/placeholder.txt

      - name: Fetch Windows AI runtimes (llama-server, sd-cli, onnxruntime)
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        run: |
          & scripts\fetch-llama-server.ps1
          & scripts\fetch-sd.ps1
          & scripts\fetch-onnxruntime.ps1
          Write-Host "Verifying bundled Windows resources:"
          Get-ChildItem -Recurse src-tauri\resources | Select-Object FullName
          if (-not (Test-Path "src-tauri\resources\llama\llama-server.exe")) {
            throw "llama-server.exe is missing from src-tauri\resources\llama"
          }
          if (-not (Test-Path "src-tauri\resources\sd\sd-cli.exe")) {
            throw "sd-cli.exe is missing from src-tauri\resources\sd"
          }
          if (-not (Test-Path "src-tauri\resources\onnxruntime\onnxruntime.dll")) {
            throw "onnxruntime.dll is missing from src-tauri\resources\onnxruntime"
          }

      - name: Fetch macOS AI runtimes (llama-server, sd-cli, onnxruntime)
        if: matrix.platform == 'macos-latest'
        shell: bash
        run: |
          bash scripts/setup-mac.sh
          echo "Verifying bundled macOS resources:"
          ls -la src-tauri/resources/llama
          ls -la src-tauri/resources/sd
          ls -la src-tauri/resources/onnxruntime
          if [ ! -f "src-tauri/resources/llama/llama-server" ]; then
            echo "Error: llama-server is missing from src-tauri/resources/llama" >&2
            exit 1
          fi
          if [ ! -f "src-tauri/resources/sd/sd-cli" ]; then
            echo "Error: sd-cli is missing from src-tauri/resources/sd" >&2
            exit 1
          fi
          if [ ! -f "src-tauri/resources/onnxruntime/libonnxruntime.dylib" ]; then
            echo "Error: libonnxruntime.dylib is missing from src-tauri/resources/onnxruntime" >&2
            exit 1
          fi

      - name: Pre-populate NSIS and nsis_tauri_utils (Windows)
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        run: |
          $tauriNsis = "$env:LOCALAPPDATA\tauri\NSIS"
          New-Item -ItemType Directory -Force -Path $tauriNsis | Out-Null

          # Copy vendor nsis-3.11.zip into Tauri's cache
          Copy-Item -Path ".github\vendor\nsis-3.11.zip" -Destination "$tauriNsis\nsis-3.11.zip" -Force

          # Extract nsis-3.11.zip so nsis-3.11 directory is immediately populated
          Expand-Archive -Path "$tauriNsis\nsis-3.11.zip" -DestinationPath $tauriNsis -Force

          # Place verified nsis_tauri_utils.dll into required plugin directories
          $destPlugin1 = "$tauriNsis\nsis-3.11\Plugins\x86-unicode\additional"
          $destPlugin2 = "$tauriNsis\Plugins\x86-unicode\additional"
          New-Item -ItemType Directory -Force -Path $destPlugin1 | Out-Null
          New-Item -ItemType Directory -Force -Path $destPlugin2 | Out-Null
          Copy-Item -Path ".github\vendor\nsis_tauri_utils.dll" -Destination "$destPlugin1\nsis_tauri_utils.dll" -Force
          Copy-Item -Path ".github\vendor\nsis_tauri_utils.dll" -Destination "$destPlugin2\nsis_tauri_utils.dll" -Force

          # Verify files and hashes
          Write-Host "Verifying pre-cached NSIS package:"
          Get-FileHash "$destPlugin1\nsis_tauri_utils.dll" -Algorithm SHA1
          Get-FileHash "$tauriNsis\nsis-3.11.zip" -Algorithm SHA1

      - name: Build Tauri Desktop Application (.exe / .dmg / .app)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'Second Brain ${{ github.ref_name }}'
          releaseBody: |
            ## Second Brain ${{ github.ref_name }}
            
            ### Included Release Assets:
            - **Windows**: `Second Brain_*_x64-setup.exe` (NSIS Installer) & `.msi`
            - **macOS**: `Second Brain_*_aarch64.dmg` (Disk Image) & `.app`
            
            ### Highlights:
            - **Infinite Canvas & Mochi Co-Pilot**: Interactive 24-mascot companion studio with lively 8-way eye tracking.
            - **Local-First AI Engine**: Offline image diffusion, local GGUF text generation, and dynamic chat canvas.
            - **Bento Studio Preferences**: Creator profile rank, clean mascot badges, and balanced configuration tabs.
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}

