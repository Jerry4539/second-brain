[package]
name = "app"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
license = ""
repository = ""
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.6", features = [] }
tauri-plugin-log = "2"
tauri-plugin-sql = { version = "2.4.1", features = ["sqlite"] }
tauri-plugin-dialog = "2.7.3"
tauri-plugin-opener = "2.5.5"
uuid = { version = "1.20.0", features = ["v4"] }
futures-util = "0.3.34"
tokio = { version = "1.53.1", features = ["process", "time", "rt", "macros", "sync"] }
reqwest = { version = "0.13.3", default-features = false, features = ["json", "stream", "rustls"] }
ort = { version = "2.0.0-rc.13", default-features = false, features = ["load-dynamic", "std", "ndarray"] }
tokenizers = { version = "0.23", default-features = false, features = ["progressbar", "fancy-regex"] }
zip = { version = "2.2", default-features = false, features = ["deflate"] }
